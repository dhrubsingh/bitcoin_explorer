# Appends newly mined blocks to public/data/recent.bin.gz once a week.
# The push triggers a Vercel redeploy; between refreshes the site backfills from mempool.space in the browser.
name: Refresh block data
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run data:update
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data; then echo "No new blocks"; exit 0; fi
          git config user.name "chain-rings-bot"
          git config user.email "chain-rings-bot@users.noreply.github.com"
          git add public/data
          git commit -m "data: blocks through $(node -p "require('./public/data/meta.json').count - 1")"
          git push
